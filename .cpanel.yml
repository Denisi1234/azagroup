---
deployment:
  tasks:
    # For an addon domain, change this to its document root in cPanel > Domains.
    - export DEPLOYPATH="$HOME/public_html"
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/cp -R index.html contact.html send-enquiry.php robots.txt sitemap.xml site.webmanifest favicon.ico favicon-192.png apple-touch-icon.png assert assets client_logo css js "$DEPLOYPATH/"
